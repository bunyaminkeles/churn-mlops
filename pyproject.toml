[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "churn-mlops"
version = "0.1.0"
description = "End-to-end production-ready MLOps pipeline for customer churn prediction"
readme = "README.md"
requires-python = ">=3.10,<3.13"

# Çekirdek: tüm bileşenlerin (train, serve, monitor) ortak ihtiyacı
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "joblib>=1.4",
    "mlflow>=2.16",
]

[project.optional-dependencies]
train = ["dvc>=3.50"]
serve = ["fastapi>=0.115", "uvicorn[standard]>=0.30"]
monitor = ["evidently>=0.7"]
dev = [
    "churn-mlops[train,serve,monitor]",
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "black>=24.4",
    "isort>=5.13",
    "flake8>=7.0",
    "pre-commit>=3.7",
]

[tool.setuptools.packages.find]
where = ["src"]

# ---------- Araç Konfigürasyonları ----------
[tool.black]
line-length = 88
target-version = ["py312"]

[tool.isort]
profile = "black"
known_first_party = ["churn_mlops"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=churn_mlops --cov-report=term-missing"
markers = ["integration: dış servis veya dosya sistemi gerektiren testler"]

[tool.coverage.run]
source = ["src/churn_mlops"]
omit = ["*/__init__.py"]

[tool.coverage.report]
exclude_also = ["if __name__ == .__main__.:"]
